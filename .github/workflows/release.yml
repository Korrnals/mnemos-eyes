name: release

# Builds the vesmaro-eyes image and pushes it to ghcr.io/korrnals/vesmaro-eyes
# on every tag push (v*). The GITHUB_TOKEN push auto-links the package to
# this repository — the Packages block on the repo page stays populated.
# Also publishes a GitHub Release with generated notes.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  build-push-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true