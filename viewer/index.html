<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="mnemos-eyes — read-only viewer for mnemos memory"
    />
    <title>mnemos-eyes</title>
    <script>
      // Theme bootstrap: resolves the theme before first paint so system-light
      // users never flash the dark :root tokens (design-system.md §9: stored
      // choice wins, else system preference, else dark). Mirrors
      // src/components/theme-provider.tsx — keep the storage keys and
      // resolution order in sync (guarded by src/styles/tokens.test.ts):
      // UI-23 migration reads vesmaro.theme first, then the legacy
      // mnemos-eyes:theme, then the OS preference.
      try {
        var stored = localStorage.getItem("vesmaro.theme");
        if (stored !== "light" && stored !== "dark") {
          stored = localStorage.getItem("mnemos-eyes:theme");
        }
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        if (theme === "light") document.documentElement.dataset.theme = "light";
      } catch (_error) {
        /* Storage unavailable: keep dark :root defaults. */
      }
    </script>
    <script>
      // Density bootstrap (Ф1, concept §3.3): applies the stored compact
      // choice before first paint so compact users never see comfortable row
      // heights flash. Mirrors src/components/density-provider.tsx — keep the
      // "vesmaro.density" key and the comfortable default in sync.
      try {
        var density = localStorage.getItem("vesmaro.density");
        document.documentElement.dataset.density =
          density === "compact" ? "compact" : "comfortable";
      } catch (_error) {
        /* Storage unavailable: comfortable :root defaults. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
