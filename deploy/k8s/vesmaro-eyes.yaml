# vesmaro-eyes — ai-agent cluster deployment (k3s, namespace kube-agents).
#
# Applied via: ./deploy/apply.sh
#
# Pattern mirrors agentsnode-mnemos: Deployment (Recreate) + ClusterIP +
# traefik Ingress on vesmaro.abyss.lab. Board DB lives on a local-path PVC.
#
# The vesmaro-eyes-mnemos secret (board bearer token, mnk_..., totp_required=0)
# is managed OUT of band — one-off:
#   kubectl -n kube-agents exec deploy/agentsnode-mnemos -- \
#     mnemos auth token create --name vesmaro-eyes-board --no-totp
#   kubectl -n kube-agents patch secret vesmaro-eyes-mnemos \
#     --type merge -p '{"stringData":{"MNEMOS_TOKEN":"mnk_..."}}'
# It is deliberately NOT declared here so `kubectl apply` never wipes it.
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-agents
  labels:
    app.kubernetes.io/part-of: agentsnode
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vesmaro-eyes
  namespace: kube-agents
  labels:
    app.kubernetes.io/name: vesmaro-eyes
    app.kubernetes.io/component: board
    app.kubernetes.io/part-of: agentsnode
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vesmaro-eyes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vesmaro-eyes
        app.kubernetes.io/component: board
        app.kubernetes.io/part-of: agentsnode
    spec:
      # This cluster's traefik pod cannot reach other pods' IPs (see
      # agentsnode-hermes-desktop for the working pattern): every ingress
      # that works here points at hostNetwork endpoints. Run the board on
      # the host network so its endpoint is 192.168.1.72:8080.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: eyes
          image: ghcr.io/korrnals/vesmaro-eyes:0.7.3
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MNEMOS_URL
              value: http://agentsnode-mnemos:8787
            - name: MNEMOS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vesmaro-eyes-mnemos
                  key: MNEMOS_TOKEN
            - name: MNEMOS_LAPTOP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vesmaro-eyes-laptop
                  key: MNEMOS_LAPTOP_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 14
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 90
            timeoutSeconds: 14
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vesmaro-eyes-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vesmaro-eyes-data
  namespace: kube-agents
  labels:
    app.kubernetes.io/name: vesmaro-eyes
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vesmaro-eyes
  namespace: kube-agents
  labels:
    app.kubernetes.io/name: vesmaro-eyes
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vesmaro-eyes
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vesmaro-eyes-ingress
  namespace: kube-agents
  labels:
    app.kubernetes.io/name: vesmaro-eyes
spec:
  ingressClassName: traefik
  rules:
    - host: vesmaro.abyss.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vesmaro-eyes
                port:
                  number: 8080