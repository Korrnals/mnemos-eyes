{{- if and .Values.uiToken.enabled (not .Values.uiToken.existingSecret) -}}
{{/* VESMARO_UI_TOKEN (ADR 0009 A1 token split), generated once: on the
first enable randAlphaNum(48) is rendered and persisted into the cluster;
on every later upgrade lookup() re-reads the existing secret so the token
is STABLE across releases (same pattern as secret-board-token.yaml).
helm template / CI renderings always get a fresh random value — never
apply `helm template` output manually. Only rendered when uiToken.enabled
is set: the default transition mode must NOT provision a ui token, or
the board token would stop working for the owner UI on upgrade. */}}
{{- $name := include "vesmaro-eyes.uiTokenSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vesmaro-eyes.labels" . | nindent 4 }}
  annotations:
    # Data-bearing secret with no replacement semantics: never garbage-
    # collected by uninstall/rollback of the release.
    helm.sh/resource-policy: keep
type: Opaque
data:
  VESMARO_UI_TOKEN: {{ if $existing }}{{ index $existing.data "VESMARO_UI_TOKEN" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
