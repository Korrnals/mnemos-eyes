{{- if not .Values.boardToken.existingSecret -}}
{{/* VESMARO_BOARD_TOKEN, generated once: on the first install
randAlphaNum(48) is rendered and persisted into the cluster; on every
later upgrade lookup() re-reads the existing secret so the token is
STABLE across releases. helm template / CI renderings always get a
fresh random value — never apply `helm template` output manually. */}}
{{- $name := include "vesmaro-eyes.boardTokenSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vesmaro-eyes.labels" . | nindent 4 }}
  annotations:
    # Data-bearing secret with no replacement semantics: never garbage-
    # collected by uninstall/rollback of the release.
    helm.sh/resource-policy: keep
type: Opaque
data:
  VESMARO_BOARD_TOKEN: {{ if $existing }}{{ index $existing.data "VESMARO_BOARD_TOKEN" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
