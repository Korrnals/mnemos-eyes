# vesmaro-eyes — task board (docker / podman compose)
#
# Run:    docker compose up -d  (или podman-compose up -d)
# Stop:   docker compose down
# Logs:   docker compose logs -f eyes
#
# The image is published on ghcr — public, no login needed
# (https://github.com/Korrnals?tab=packages). Pin a release with
# image: ghcr.io/korrnals/vesmaro-eyes:<x.y.z>; build locally instead:
#   docker build -t vesmaro-eyes:local -f Containerfile .
#
# The board DB lives in ./data (bind mount into the project directory),
# so board state survives rebuilds and is inspectable from the host.
#
# MNEMOS_URL points at the host machine's mnemos (compose port 8787).
# MNEMOS_TOKEN: export MNEMOS_TOKEN='mnk_...' before `up` — token with
# totp_required=0 from the mnemos operator (see mnemos docs, api-key).

services:
  eyes:
    image: ghcr.io/korrnals/vesmaro-eyes:latest
    container_name: vesmaro-eyes
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - ./data:/data
    environment:
      - MNEMOS_URL=${MNEMOS_URL:-http://host.containers.internal:8787}
      - MNEMOS_TOKEN=${MNEMOS_TOKEN:-}
      # SEC-3: mutations are fail-closed — a dev default keeps the local
      # scenario working; production must override via the chart secret.
      - VESMARO_BOARD_TOKEN=${VESMARO_BOARD_TOKEN:-dev-board-token-change-me}
      # SEC-1: egress allowlist for memory-server hosts (dev: local mnemos).
      - VESMARO_ALLOWED_MEMORY_HOSTS=${VESMARO_ALLOWED_MEMORY_HOSTS:-host.containers.internal,localhost,127.0.0.1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s