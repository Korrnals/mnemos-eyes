<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>vesmaro-eyes — task board</title>
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/board.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230d0f14' stroke='%231a8a96' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='%2322b5c4'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app" class="shell">

    <!-- ── Top bar ─────────────────────────────────────────────── -->
    <header class="topbar">
      <div class="brand">
        <svg class="iris" viewBox="0 0 48 48" aria-hidden="true">
          <circle class="iris-sclera" cx="24" cy="24" r="21" />
          <circle class="iris-ring" cx="24" cy="24" r="14.5" />
          <circle class="iris-pupil" cx="24" cy="24" r="6.5" />
          <circle class="iris-glint" cx="27.5" cy="20.5" r="1.8" />
        </svg>
        <div class="brand-text">
          <span class="brand-name">vesmaro-eyes</span>
          <span class="brand-sub">task board · a gaze into the work</span>
        </div>
      </div>
      <div class="topbar-status" id="conn-status" title="live updates">
        <span class="dot dot-off" id="conn-dot"></span>
        <span id="conn-label">connecting…</span>
      </div>
      <div class="topbar-mnemos" id="mnemos-status" title="mnemos memory engine">
        <svg class="mnemos-ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1Zm0 2a5 5 0 0 1 4.9 4H10L8 9 6 7H3.1A5 5 0 0 1 8 3Zm-4.9 6H6l2 2 2-2h2.9A5 5 0 0 1 3.1 9Z"/></svg>
        <span id="mnemos-label">mnemos: …</span>
      </div>
      <button class="theme-toggle" id="theme-toggle" title="тема" aria-label="Переключить тему">◐</button>
    </header>

    <!-- ── Main: board + right rail ────────────────────────────── -->
    <main class="main">
      <section class="board-wrap">
        <div class="board" id="board"><!-- columns render here --></div>
      </section>
      <aside class="rail">
        <section class="rail-block">
          <h2 class="rail-title">Пульс памяти</h2>
          <p class="rail-sub">свежие воспоминания проекта из живого mnemos</p>
          <div id="pulse" class="pulse"><!-- pulse items --></div>
        </section>
        <section class="rail-block">
          <h2 class="rail-title">Специалисты</h2>
          <div id="roster" class="roster"><!-- specialist chips --></div>
        </section>
        <section class="rail-block">
          <h2 class="rail-title">Среды</h2>
          <div id="envs" class="envs"><!-- env chips --></div>
        </section>
      </aside>
    </main>
  </div>

  <!-- ── Task drawer ───────────────────────────────────────────── -->
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-role="dialog" aria-label="Задача">
    <div class="drawer-head">
      <span class="drawer-col" id="drawer-col">open</span>
      <button class="drawer-close" id="drawer-close" aria-label="Закрыть">×</button>
    </div>
    <h1 class="drawer-title" id="drawer-title"></h1>
    <p class="drawer-summary" id="drawer-summary"></p>

    <section class="drawer-section">
      <h2>Память mnemos</h2>
      <div id="drawer-memories" class="drawer-memories"></div>
    </section>

    <section class="drawer-section">
      <h2>Исполнение</h2>
      <div class="drawer-meta" id="drawer-meta"></div>
    </section>

    <section class="drawer-section" id="spec-section">
      <h2>Спецификация</h2>
      <pre class="drawer-spec" id="drawer-spec"></pre>
    </section>
  </aside>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
