# ============================================================================
# Docs upstream import — L1 configuration (ARCHCOM-7 contract 2026-09-23,
# §2 layers, §3 selection matrix). Consumed by scripts/sync_docs.py.
#
# Layers: L0 = local clones pinned by `ref` (full SHA, honestly pinned —
# sync FAILS if a clone has tracked modifications). L1 = this file + the
# script (selection, normalization, overlays, link rewriting, vendoring).
# L2 = generated corpus under viewer/src/features/docs/content/upstream/
# plus vendored assets and the provenance/sidecar manifests. L2 is
# read-only for humans: style changes go through `overlays` here; an
# overlay anchor that no longer matches = sync failure (upstream drift
# signal, contract §6.3).
#
# Selection rule (contract §6.6): ONLY `include` entries are generated.
# `exclude` entries document why a path stays out; the script refuses a
# config where an include matches an exclude.
# ============================================================================

projects:
  # ---------------------------------------------------------------- mnemos ---
  mnemos:
    repo: ../mnemos
    # Pinned 2026-09-23 (wave W1a). Re-pin deliberately: update the SHA,
    # re-run `npm run sync-docs`, diff-review the corpus (Docs Writer).
    ref: 23f0fce42ea87c329d4049397292b3dca948773c
    # Non-docs links (CONTRIBUTING.md, config.example.yaml, …) are rewritten
    # to this template at the pinned SHA; {sha} is substituted.
    web_base: "https://github.com/vesmaro/vesmaro/blob/{sha}"
    locale_dirs:
      en: docs/en
      ru: docs/ru
    include:
      # --- user/ — целиком, 10 файлов (контракт §3, строка 1). -------------
      # note: — кураторское интро W2 (единственное место пересказа; тело
      # апстрима не редактируется, контракт §2). Фронтенд показывает его
      # блоккетом под banner'ом GENERATED.
      - path: user/getting-started.md
        category: mnemos-user
        order: 1
        note:
          en: >-
            Curator: the complete first run of Mnemos — one-line install,
            first memory, first search, connecting an agent harness.
          ru: >-
            Куратор: полный первый прогон mnemos — установка одной командой,
            первая запись, первый поиск, подключение агента-харнеса.
      - path: user/integration-guide.md
        category: mnemos-user
        order: 2
        note:
          en: >-
            Curator: behavioral triggers that make agents actually use the
            memory — session-start recall, checkpoints, mandatory tags.
          ru: >-
            Куратор: поведенческие триггеры, которые заставляют агентов
            реально пользоваться памятью, — recall в начале сессии,
            чекпоинты, обязательные теги.
      - path: user/sync.md
        category: mnemos-user
        order: 3
        note:
          en: >-
            Curator: offline batch sync between two Mnemos instances via
            cron and rsync — Mnemos itself makes no network calls.
          ru: >-
            Куратор: офлайн-синхронизация двух инстансов mnemos по cron
            и rsync — mnemos сам сетевых вызовов не делает.
      - path: user/context-filter.md
        category: mnemos-user
        order: 4
        note:
          en: >-
            Curator: the five-stage pipeline cleaning raw content before a
            model sees it — what the board shows as «raw → processed».
          ru: >-
            Куратор: пятиступенчатый конвейер очистки сырья до подачи в
            модель — то, что борд показывает как «сырое → обработано».
      - path: user/tag-contract.md
        category: mnemos-user
        order: 5
        note:
          en: >-
            Curator: the mandatory tag schema of Mnemos — prefixes, allowed
            values, migration; the board's «Mnemos tags» field follows it.
          ru: >-
            Куратор: обязательная схема тегов mnemos — префиксы, допустимые
            значения, миграция; поле «Теги mnemos» у задач борда живёт по
            этому контракту.
      - path: user/metrics.md
        category: mnemos-user
        order: 6
        note:
          en: >-
            Curator: the three HTTP endpoints behind the board's «Пульс»
            feed and overview stats, plus a Prometheus exposition.
          ru: >-
            Куратор: три HTTP-эндпоинта, на которых держатся «Пульс» и
            статистика «Обзора» борда, плюс Prometheus-экспозиция.
      - path: user/export-import.md
        category: mnemos-user
        order: 7
        note:
          en: >-
            Curator: backup, move, and restore Mnemos memories via CLI or
            HTTP API — JSON with metadata or full SQLite snapshots.
          ru: >-
            Куратор: резервные копии и перенос записей mnemos через CLI
            или HTTP API — JSON с метаданными или полные SQLite-снимки.
      - path: user/cli-reference.md
        category: mnemos-user
        order: 8
        note:
          en: >-
            Curator: complete reference for the mnemos CLI — every
            subcommand with runnable examples.
          ru: >-
            Куратор: полный справочник CLI mnemos — все подкоманды
            с запускабельными примерами.
      - path: user/http-api.md
        category: mnemos-user
        order: 9
        note:
          en: >-
            Curator: the full HTTP surface of Mnemos — memory, search,
            pipeline, DLQ, traces, A2A sessions; the requests the board
            makes to stores.
          ru: >-
            Куратор: полная HTTP-поверхность mnemos — память, поиск,
            конвейер, DLQ, трассировки, A2A-сессии; именно этими запросами
            борд читает хранилища.
      - path: user/mcp-tools.md
        category: mnemos-user
        order: 10
        note:
          en: >-
            Curator: all mnemos_* tools for MCP clients — the same layer
            agents on the board use to work with memory.
          ru: >-
            Куратор: все инструменты mnemos_* для MCP-клиентов — тот же
            слой, через который агенты работают с памятью на борде.
      # --- admin/ — ФИНАЛЬНЫЙ список W2 (контракт §3: страницы, на которые
      # --- смотрят наши runbook-страницы; решение по кандидатам — в exclude).
      - path: admin/security.md
        category: mnemos-admin
        order: 1
        note:
          en: >-
            Curator: the Mnemos security posture — TOTP, non-loopback
            guard, threat model; background for the board's tokens page.
          ru: >-
            Куратор: позиция безопасности mnemos — TOTP, не-loopback guard,
            модель угроз; фон для страницы борда «Токены и доступ».
      - path: admin/federation.md
        category: mnemos-admin
        order: 2
        note:
          en: >-
            Curator: federation on the Mnemos side — per-peer ACL, trigger
            codes, access log; the foundation of the observed mesh nodes.
          ru: >-
            Куратор: федерация на стороне mnemos — per-peer ACL, коды
            триггера, журнал доступа; фундамент наблюдаемых «Узлов меша».
      - path: admin/runbooks/install.md
        category: mnemos-admin
        order: 3
        note:
          en: >-
            Curator: installing Mnemos — the board's prerequisite: PyPI
            install, first run, the mnk_… token for the store hookup.
          ru: >-
            Куратор: установка mnemos — предпосылка борда: PyPI-установка,
            первый запуск, токен mnk_… для подключения хранилища.
      # W2, решение по кандидату: наша backup-restore.md копирует
      # mnemos.db/vectors.db — апстрим-ранбук про то же, глубже.
      - path: admin/runbooks/backup-restore.md
        category: mnemos-admin
        order: 4
        note:
          en: >-
            Curator: the upstream runbook for backing up and restoring
            Mnemos data — goes deeper than the board's own backup page.
          ru: >-
            Куратор: апстрим-ранбук бэкапа и восстановления данных mnemos —
            глубже нашей страницы «Бэкап и восстановление».
      # --- architecture/ — одна обзорная (контракт §3) ---------------------
      - path: architecture/overview.md
        category: mnemos-architecture
        order: 1
        note:
          en: >-
            Curator: how Mnemos is built — hybrid memory, the CLI/HTTP/MCP
            surfaces, and where vesmaro-eyes fits.
          ru: >-
            Куратор: как устроен mnemos — гибридная память, поверхности
            CLI/HTTP/MCP и место vesmaro-eyes в картине.
    exclude:
      # --- W2-решения по висящим слагам (ссылки из включённых страниц) -----
      - path: architecture/a2a-sessions.md
